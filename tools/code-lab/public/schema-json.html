<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON — инспектор</title>
<link rel="stylesheet" href="/style.css">
<style>
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  .lead{color:var(--text2);font-size:13px;margin:0 0 14px;max-width:820px}
  .drop{border:1px dashed var(--border);border-radius:10px;padding:26px;text-align:center;color:var(--text3);cursor:pointer;background:var(--bg2)}
  .drop.over{border-color:var(--acc);color:var(--text2);background:rgba(255,0,110,.06)}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
  .bar select,.bar input{background:var(--s2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;padding:7px 10px}
  .bar input[type=search]{flex:1;min-width:200px;font-family:ui-monospace,monospace}
  .summary{font-size:12px;color:var(--text3);font-family:ui-monospace,monospace;margin:6px 0}
  .summary b{color:var(--text2)}
  .tree{background:#0E0720;border:1px solid var(--border);border-radius:9px;padding:12px;font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.6;overflow:auto;max-height:65vh}
  .jline{white-space:pre}
  .jrow{cursor:pointer;display:inline-flex;align-items:baseline;gap:5px}
  .jrow:hover{background:rgba(255,255,255,.05);border-radius:4px}
  .jtog{color:var(--text3);width:10px;display:inline-block}
  .jkids{padding-left:16px;border-left:1px solid var(--border);margin-left:4px}
  .jkey{color:#3DD9FF}
  .jmeta{color:var(--text3);font-size:11px}
  .jt-string{color:#52F2C9}.jt-number{color:#FF8800}.jt-boolean{color:#B45CFF}.jt-null{color:#9090BB}
  .res{font-size:12px;line-height:1.7}
  .res .p{color:#3DD9FF;cursor:pointer}.res .p:hover{text-decoration:underline}
  .res .v{color:var(--text2)}
  .err{color:var(--warn,#E8895A);font-size:12.5px;font-family:ui-monospace,monospace;white-space:pre-wrap}
  .saved{margin:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .savedh{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
  .chip{font-size:12px;background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:4px 10px;cursor:pointer;color:var(--text2)}
  .chip:hover{border-color:var(--acc);color:var(--text)}
  .chip .del{color:var(--text3);margin-left:6px;cursor:pointer}
  .chip .del:hover{color:var(--danger,#FF4D7A)}
  .btn{font:12px/1 ui-monospace,monospace;color:var(--text2);background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer}
  .btn:hover{color:var(--acc);border-color:rgba(255,0,110,.4)}
</style>
</head>
<body>
  <header>
    <h1>JSON — инспектор</h1>
    <div class="sub">Кинь сюда <b>.json</b>, <b>.gz</b> или <b>.zip</b> (с JSON внутри) — разберётся прямо в браузере, офлайн. Смотри дерево, ищи по ключам/значениям.</div>
    <div class="tabs"><a href="/">Шаблоны</a><a href="/schema.html">Схемы</a><a href="/schema-data.html">Структуры</a><a href="/schema-json.html" class="on">JSON</a></div>
  </header>
  <div class="wrap">
    <div class="drop" id="drop">перетащи файл сюда или нажми, чтобы выбрать<input type="file" id="file" accept=".json,.gz,.zip,application/json,application/gzip,application/zip" multiple style="display:none"></div>
    <div class="saved" id="saved"></div>
    <div class="err" id="err"></div>
    <div class="bar" id="bar" style="display:none">
      <select id="pick" title="файл из архива"></select>
      <input type="search" id="q" placeholder="поиск по ключам и значениям…">
    </div>
    <div class="bar" id="savebar" style="display:none">
      <input id="sname" placeholder="название для сохранения" style="min-width:180px">
      <input id="sdesc" placeholder="описание (необязательно)" style="flex:1;min-width:180px">
      <button class="btn" id="savebtn">💾 сохранить этот</button>
      <button class="btn" id="saveall">💾 сохранить всё</button>
    </div>
    <div class="summary" id="sum"></div>
    <div class="tree" id="tree" style="display:none"></div>
  </div>

<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), fileInput = $('#file'), err = $('#err'), bar = $('#bar'), pick = $('#pick'), q = $('#q'), sum = $('#sum'), tree = $('#tree');
let files = [];   // [{name, data}]  — распарсенные JSON

drop.onclick = () => fileInput.click();
fileInput.onchange = e => handle(e.target.files);
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handle(e.dataTransfer.files));

async function handle(fileList){
  err.textContent = ''; files = [];
  for(const f of fileList){
    try {
      const got = await extract(f);        // → [{name, text}]
      for(const g of got){
        try { files.push({ name: g.name, data: JSON.parse(g.text) }); }
        catch(e){ err.textContent += '«' + g.name + '» не JSON: ' + e.message + '\n'; }
      }
    } catch(e){ err.textContent += '«' + f.name + '»: ' + e.message + '\n'; }
  }
  if(!files.length){ bar.style.display = 'none'; tree.style.display = 'none'; sum.textContent = ''; return; }
  pick.innerHTML = files.map((f,i) => '<option value="'+i+'">'+esc(f.name)+'</option>').join('');
  bar.style.display = 'flex'; tree.style.display = 'block';
  $('#savebar').style.display = 'flex'; $('#sname').value = files[0].name; $('#sdesc').value = '';
  show(0);
}
pick.onchange = () => { show(+pick.value); $('#sname').value = files[+pick.value].name; };

// ── сохранение на диск локального сервера + список сохранённого ──────────────
async function loadSaved(){
  let list; try { list = await fetch('/api/data/list').then(r => r.json()); } catch(_){ return; }
  const box = $('#saved');
  if(!list.length){ box.innerHTML = ''; return; }
  box.innerHTML = '<span class="savedh">сохранено:</span>' + list.map(x =>
    '<span class="chip" data-id="'+esc(x.id)+'" title="'+esc(x.desc || x.savedAt)+'">'+esc(x.name)+' <b class="del" data-id="'+esc(x.id)+'">×</b></span>').join('');
  box.querySelectorAll('.chip').forEach(ch => {
    ch.onclick = async e => {
      if(e.target.classList.contains('del')){ await fetch('/api/data/delete', { method:'POST', body: JSON.stringify({ id: ch.dataset.id }) }); loadSaved(); return; }
      const j = await fetch('/api/data/get?id=' + encodeURIComponent(ch.dataset.id)).then(r => r.json());
      files = [{ name: j.name, data: j.data }];
      pick.innerHTML = '<option value="0">'+esc(j.name)+'</option>';
      bar.style.display = 'flex'; tree.style.display = 'block'; $('#savebar').style.display = 'flex';
      $('#sname').value = j.name; $('#sdesc').value = j.desc || '';
      show(0);
    };
  });
}
$('#savebtn').onclick = async () => {
  if(!files.length) return;
  const f = files[+pick.value || 0];
  const body = { name: $('#sname').value || f.name, desc: $('#sdesc').value, data: f.data };
  const btn = $('#savebtn'); btn.textContent = 'сохраняю…';
  const r = await fetch('/api/data/save', { method: 'POST', body: JSON.stringify(body) }).then(r => r.json()).catch(() => ({}));
  btn.textContent = r.id ? '✓ сохранено' : 'ошибка'; setTimeout(() => btn.textContent = '💾 сохранить этот', 1300);
  loadSaved();
};
$('#saveall').onclick = async () => {
  if(!files.length) return;
  const btn = $('#saveall'); btn.textContent = 'сохраняю…'; let ok = 0;
  for(const f of files){
    const r = await fetch('/api/data/save', { method: 'POST', body: JSON.stringify({ name: f.name, desc: $('#sdesc').value, data: f.data }) }).then(r => r.json()).catch(() => ({}));
    if(r.id) ok++;
  }
  btn.textContent = '✓ сохранено ' + ok + '/' + files.length; setTimeout(() => btn.textContent = '💾 сохранить всё', 1600);
  loadSaved();
};
loadSaved();
q.oninput = () => render();

// ── извлечение: json / gz / zip ──────────────────────────────────────────────
async function extract(f){
  const name = f.name.toLowerCase();
  const buf = await f.arrayBuffer();
  const b = new Uint8Array(buf);
  if(name.endsWith('.zip') || (b[0]===0x50 && b[1]===0x4b)) return await unzip(buf);
  if(name.endsWith('.gz') || (b[0]===0x1f && b[1]===0x8b)){
    const text = await decomp(buf, 'gzip');
    return [{ name: f.name.replace(/\.gz$/i,'') || f.name, text }];
  }
  return [{ name: f.name, text: new TextDecoder().decode(buf) }];
}
async function decomp(buf, fmt){
  const ds = new DecompressionStream(fmt);
  const stream = new Blob([buf]).stream().pipeThrough(ds);
  return await new Response(stream).text();
}
// мини-разборщик ZIP через центральный каталог (надёжнее локальных заголовков)
async function unzip(buf){
  const dv = new DataView(buf), bytes = new Uint8Array(buf), dec = new TextDecoder();
  let eocd = -1;
  for(let i = buf.byteLength - 22; i >= 0 && i > buf.byteLength - 22 - 65536; i--){ if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; } }
  if(eocd < 0) throw new Error('повреждённый ZIP (нет оглавления)');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const out = [];
  for(let n = 0; n < count; n++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const commentLen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = dec.decode(bytes.subarray(off + 46, off + 46 + nameLen));
    off += 46 + nameLen + extraLen + commentLen;
    if(!/\.json$/i.test(name)) continue;
    const lnameLen = dv.getUint16(lho + 26, true), lextraLen = dv.getUint16(lho + 28, true);
    const dataStart = lho + 30 + lnameLen + lextraLen;
    const comp = bytes.subarray(dataStart, dataStart + compSize);
    let text;
    if(method === 0) text = dec.decode(comp);
    else if(method === 8) text = await decomp(comp, 'deflate-raw');
    else { err.textContent += name + ': неизвестное сжатие\n'; continue; }
    out.push({ name: name.split('/').pop(), text });
  }
  if(!out.length) throw new Error('в архиве нет .json');
  return out;
}

// ── показ ────────────────────────────────────────────────────────────────────
let current = null;
function show(i){ current = files[i].data; summary(files[i]); render(); }
function summary(f){
  const d = f.data, t = kind(d);
  let s = '<b>' + f.name + '</b> · тип: ' + t;
  if(Array.isArray(d)) s += ' · элементов: ' + d.length;
  else if(d && typeof d === 'object') s += ' · ключей: ' + Object.keys(d).length + ' (' + Object.keys(d).slice(0,8).join(', ') + (Object.keys(d).length>8?'…':'') + ')';
  sum.innerHTML = s;
}
function render(){
  tree.innerHTML = '';
  const query = q.value.trim().toLowerCase();
  if(query){ tree.appendChild(results(current, query)); return; }
  tree.appendChild(node('корень', current, true));
}
function node(key, val, open){
  if(val && typeof val === 'object'){
    const isArr = Array.isArray(val);
    const keys = isArr ? val.map((_,i)=>i) : Object.keys(val);
    const wrap = document.createElement('div');
    const row = document.createElement('div'); row.className = 'jrow';
    const tog = el('span','jtog', open ? '▾' : '▸');
    row.append(tog, el('span','jkey', String(key)), el('span','jmeta', isArr ? ('['+keys.length+']') : ('{'+keys.length+'}')));
    const kids = document.createElement('div'); kids.className = 'jkids'; kids.style.display = open ? 'block' : 'none';
    let built = false;
    const build = () => { if(built) return; built = true; keys.forEach(k => kids.append(node(isArr ? ('['+k+']') : k, val[k]))); };
    if(open) build();
    row.onclick = () => { const o = kids.style.display === 'none'; kids.style.display = o ? 'block' : 'none'; tog.textContent = o ? '▾' : '▸'; if(o) build(); };
    wrap.append(row, kids);
    return wrap;
  }
  const line = document.createElement('div'); line.className = 'jline';
  line.append(el('span','jkey', String(key)), document.createTextNode(': '), el('span','jval jt-'+kind(val), fmt(val)));
  return line;
}
function results(data, query){
  const box = document.createElement('div'); box.className = 'res';
  const res = []; const MAX = 600;
  (function go(val, path){
    if(res.length >= MAX) return;
    if(val && typeof val === 'object'){
      const isArr = Array.isArray(val);
      (isArr ? val.map((_,i)=>i) : Object.keys(val)).forEach(k => {
        const p = path + (isArr ? ('['+k+']') : (path ? '.' : '') + k);
        if(String(k).toLowerCase().includes(query)) res.push({ p, v: preview(val[k]) });
        go(val[k], p);
      });
    } else if(String(val).toLowerCase().includes(query)){
      res.push({ p: path || '(корень)', v: fmt(val) });
    }
  })(data, '');
  if(!res.length){ box.textContent = 'ничего не найдено'; box.style.color = 'var(--text3)'; return box; }
  box.innerHTML = res.map(r => '<div><span class="p">'+esc(r.p)+'</span> <span class="v">= '+esc(r.v)+'</span></div>').join('');
  const head = document.createElement('div'); head.style.cssText = 'color:var(--text3);margin-bottom:6px'; head.textContent = 'совпадений: ' + res.length + (res.length>=MAX?'+ (показаны первые)':'');
  box.prepend(head);
  return box;
}

// ── утилиты ──────────────────────────────────────────────────────────────────
function kind(v){ return v === null ? 'null' : Array.isArray(v) ? 'array' : typeof v; }
function fmt(v){
  if(v === null) return 'null';
  if(typeof v === 'string'){ const s = v.length > 120 ? v.slice(0,120)+'…' : v; return '"' + s + '"'; }
  return String(v);
}
function preview(v){
  if(v && typeof v === 'object') return Array.isArray(v) ? ('[массив ' + v.length + ']') : ('{объект, ключей ' + Object.keys(v).length + '}');
  return fmt(v);
}
function el(tag, cls, text){ const e = document.createElement(tag); e.className = cls; if(text != null) e.textContent = text; return e; }
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
</script>
</body>
</html>
