<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог компонентов</title>
<link rel="stylesheet" href="/style.css">
<style>
  .cat{display:grid;grid-template-columns:230px 1fr;min-height:100vh;transition:grid-template-columns .15s}
  @media(max-width:860px){.cat{grid-template-columns:1fr}}
  .cat.side-off{grid-template-columns:0 1fr}
  .cat.side-off .cat-side{display:none}
  .cat-side{border-right:1px solid var(--border);padding:16px 12px;background:var(--bg2)}
  /* компактная шапка: кнопка сворачивания + заголовок + лид в одну строку */
  .cat-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .side-toggle{flex:none;align-self:center;font-size:15px;line-height:1;color:var(--text2);background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:6px 9px;cursor:pointer}
  .side-toggle:hover{color:var(--acc);border-color:rgba(255,0,110,.4)}
  .cat-side h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin:0 0 10px 6px}
  .add-comp{width:100%;background:var(--s2);border:1px dashed rgba(82,242,201,.45);color:var(--str);border-radius:9px;padding:9px 10px;font-size:13px;cursor:pointer;margin-bottom:14px}
  .add-comp:hover{border-color:var(--str);background:rgba(82,242,201,.07)}
  .axis-toggle{display:flex;gap:4px;margin-bottom:12px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px}
  .axis-toggle button{flex:1;font-size:11.5px;color:var(--text3);background:none;border:0;border-radius:7px;padding:7px 6px;cursor:pointer}
  .axis-toggle button.on{background:var(--s2);color:var(--acc)}
  .axis-toggle button:hover{color:var(--text)}
  /* меню «в раздел» */
  .colmenu{position:absolute;z-index:70;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:7px;min-width:210px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .colmenu .cm-h{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);padding:4px 7px}
  .colmenu .cm-i{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--text2)}
  .colmenu .cm-i:hover{background:var(--s2);color:var(--text)}
  .colmenu .cm-i .ck{width:14px;color:var(--str)}
  .colmenu .cm-new{display:flex;gap:5px;margin-top:5px;border-top:1px solid var(--border);padding-top:7px}
  .colmenu .cm-new input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12.5px;padding:6px 8px}
  .colmenu .cm-new button{background:var(--s2);border:1px solid var(--border);border-radius:7px;color:var(--str);cursor:pointer;padding:0 10px}
  .ccols{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .ccol{font-size:9.5px;padding:2px 7px;border-radius:9px;background:rgba(255,0,110,.12);border:1px solid rgba(255,0,110,.35);color:var(--acc)}
  .card .cbtn.del:hover{color:#FF6B6B;border-color:#FF6B6B}
  /* модалка добавления компонента */
  .modal-bg{position:fixed;inset:0;background:rgba(5,2,14,.72);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:28px 16px}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:640px;padding:20px 22px}
  .modal h3{margin:0 0 4px;font-size:17px}
  .modal .mh{color:var(--text3);font-size:12.5px;margin:0 0 16px}
  .mfield{margin-bottom:13px}
  .mfield label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin-bottom:5px}
  .mfield input,.mfield select,.mfield textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:9px 11px}
  .mfield textarea{font-family:ui-monospace,monospace;resize:vertical;min-height:120px}
  .mfield input:focus,.mfield select:focus,.mfield textarea:focus{outline:none;border-color:var(--name)}
  .mrow{display:flex;gap:12px}.mrow .mfield{flex:1}
  .mbtns{display:flex;gap:8px;margin-top:6px}
  .mbtns .btn{font:13px/1 ui-sans-serif,system-ui;padding:9px 14px}
  .mbtns .btn.ok{color:var(--str);border-color:rgba(82,242,201,.5)}
  .merr{color:#FF6B6B;font-size:12.5px;margin-top:8px}
  .m-dup{font-size:12.5px;color:var(--num);background:rgba(255,136,0,.08);border:1px solid rgba(255,136,0,.35);border-radius:8px;padding:9px 11px;margin-bottom:12px;line-height:1.5}
  .m-dup-lbl{display:inline-flex;align-items:center;gap:6px;margin-left:6px;color:var(--text2);cursor:pointer}
  .pcat{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--text2);font-size:13px;border:1px solid transparent}
  .pcat:hover{background:var(--s2);color:var(--text)}
  .pcat.on{background:linear-gradient(90deg,rgba(61,217,255,.16),rgba(180,92,255,.06));color:var(--text);border-color:rgba(61,217,255,.35)}
  .pcat .pn{flex:1}
  .pcat .pc{font-size:10px;font-family:ui-monospace,monospace;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:1px 8px}

  .cat-main{display:block;padding:22px 24px;min-width:0}
  .cat-main h1{font-size:19px;margin:0}
  .cat-lead{color:var(--text3);font-size:12px;margin:0;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filters{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:18px}
  .fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .flabel{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin-right:2px}
  .fchip{font-size:12px;padding:4px 10px;border-radius:13px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer}
  .fchip:hover{color:var(--text)}
  .fchip.on{border-color:var(--acc);color:var(--acc)}
  .search{flex:1;min-width:160px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:8px 11px;font-family:ui-monospace,monospace}
  .search:focus{outline:none;border-color:var(--name)}

  .subsec{margin-bottom:22px}
  .subh{font-size:13px;font-weight:600;color:var(--text2);margin:0 0 9px;display:flex;align-items:center;gap:8px}
  .subh .sc{font-size:10px;font-family:ui-monospace,monospace;color:var(--text3)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{display:flex;flex-direction:column;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;text-decoration:none;transition:border-color .15s,transform .1s}
  .card:hover{transform:translateY(-2px);border-color:rgba(61,217,255,.4)}
  .card.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(255,0,110,.4)}
  .cat-hint{font-size:11px;color:var(--text3);margin:0 0 12px}
  .cat-hint b{color:var(--text2)}
  .card-top{display:flex;align-items:center;gap:7px}
  .ctype{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:5px;border:1px solid var(--border)}
  .ctype.component{color:var(--kw);border-color:rgba(180,92,255,.5)}
  .ctype.fragment{color:var(--text3)}
  .ctype.recipe{color:var(--str);border-color:rgba(82,242,201,.5)}
  .ctype.module{color:var(--num);border-color:rgba(255,136,0,.5)}
  .ctitle{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.3;flex:1}
  .cdesc{font-size:12px;color:var(--text3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cio{font-size:11px;font-family:ui-monospace,monospace;color:var(--text3);display:flex;gap:6px;align-items:center}
  .cio .i{color:var(--name)}.cio .o{color:var(--str)}.cio .a{opacity:.6}
  .ctags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
  .tg{font-size:9.5px;padding:2px 7px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--text3)}
  .tg.warnflag{color:#E8895A;border-color:#E8895A}
  .cact{display:flex;gap:6px;margin-top:4px}
  .cbtn{font-size:11px;padding:5px 9px;border-radius:6px;border:1px solid var(--border);background:var(--s2);color:var(--text2);cursor:pointer}
  .cbtn:hover{color:var(--acc);border-color:rgba(255,0,110,.4)}
  .frag-toggle{font-size:12px;color:var(--text3);cursor:pointer;margin:4px 0 10px;user-select:none}
  .frag-toggle:hover{color:var(--acc)}
  .empty{color:var(--text3);font-size:13px;padding:20px 0}
</style>
</head>
<body data-page="catalog">
  <div class="cat" id="cat">
    <aside class="cat-side" id="catSide">
      <button id="addComp" class="add-comp">＋ Добавить компонент</button>
      <div class="axis-toggle" id="axisToggle">
        <button data-axis="purpose" class="on">По назначению</button>
        <button data-axis="custom">Моя классификация</button>
      </div>
      <div id="pcats"></div>
    </aside>
    <main class="cat-main">
      <div class="cat-head">
        <button id="sideToggle" class="side-toggle" title="свернуть/развернуть разделы">☰</button>
        <h1 id="cName">Каталог</h1>
        <span class="cat-lead" id="cLead"></span>
      </div>
      <div class="filters">
        <div class="fgroup"><span class="flabel">место</span><span id="placeF"></span></div>
        <div class="fgroup"><span class="flabel">технология</span><span id="techF"></span></div>
        <input class="search" id="q" placeholder="поиск по названию и описанию…">
      </div>
      <div class="cat-hint">Клик — выделить · <b>Delete</b> — удалить · двойной клик — подробнее</div>
      <div id="sections"></div>
    </main>
  </div>
  <script src="/shell.js"></script>
  <script src="/catalog.js"></script>
</body>
</html>
