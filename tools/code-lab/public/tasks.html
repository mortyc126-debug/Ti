<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задачи — Лаборатория кода</title>
<link rel="stylesheet" href="/style.css">
<style>
  .tk{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;padding:18px 20px;height:100vh;box-sizing:border-box}
  .tk-side{display:flex;flex-direction:column;min-height:0;gap:8px}
  .tk-side h1{font-size:20px;margin:0}
  .tk-lead{color:var(--text3);font-size:12px;line-height:1.5;margin:0}
  .tk-tools{display:flex;gap:6px;flex-wrap:wrap}
  .tk-q{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:8px 10px}
  .tk-q:focus{outline:none;border-color:var(--name)}
  .tk-langs{display:flex;gap:5px;flex-wrap:wrap}
  .tk-lang{background:var(--s2);border:1px solid var(--border);border-radius:14px;color:var(--text3);font:11px ui-monospace,monospace;padding:4px 9px;cursor:pointer}
  .tk-lang span{opacity:.7}
  .tk-lang.on{color:var(--text);border-color:var(--name);background:color-mix(in srgb,var(--name) 18%,var(--s2))}
  .tk-list{flex:1;min-height:0;overflow:auto;padding-right:4px}
  .tk-g{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin:10px 0 4px}
  .tk-it{display:block;padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .tk-it:hover{background:var(--s2)}
  .tk-it.on{border-color:var(--name);background:var(--s2)}
  .tk-it .t{font-size:13px;color:var(--text)}
  .tk-it .m{font:10.5px ui-monospace,monospace;color:var(--text3);margin-top:2px}
  .tk-it .bad{color:#ff6b6b}
  .tk-main{min-height:0;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
  .tk-empty{color:var(--text3);font-size:13px;line-height:1.7;max-width:640px}
  .tk-empty code,.tk-help code{background:var(--s2);border-radius:4px;padding:1px 5px;font-size:12px}
  .tk-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .tk-head h2{flex:1;margin:0;font-size:18px;min-width:200px}
  .tk-desc{color:var(--text2);font-size:13px;line-height:1.55;margin:0 0 10px;white-space:pre-wrap}
  .tk-meta{font:11px ui-monospace,monospace;color:var(--text3);margin-bottom:10px}
  .tk-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
  .tk-col h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin:0 0 8px;font-weight:600}
  .tk-asm-l{font:11px ui-monospace,monospace;color:var(--name);margin:10px 0 3px;display:flex;gap:8px;align-items:center}
  .tk-asm-l span{flex:1}
  .tk-pre{margin:0;background:var(--code-bg,var(--bg));border:1px solid var(--border);border-radius:8px;padding:9px 11px;font:12px/1.55 ui-monospace,monospace;color:var(--text2);white-space:pre;overflow:auto;max-height:46vh}
  .tk-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .tk-seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
  .tk-seg button{background:var(--s2);border:0;color:var(--text3);font:11.5px ui-monospace,monospace;padding:6px 9px;cursor:pointer}
  .tk-seg button.on{color:var(--text);background:color-mix(in srgb,var(--name) 22%,var(--s2))}
  .tk-need{margin-top:10px}
  .tk-need-it{border:1px solid var(--border);border-radius:8px;padding:7px 9px;margin:5px 0;font-size:12.5px}
  .tk-need-it b{font-family:ui-monospace,monospace;color:var(--fn)}
  .tk-need-it a{color:var(--name);text-decoration:none;margin-right:10px;font-size:12px}
  .tk-need-it .s{color:var(--text3);font-size:11.5px}
  .tk-ed{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
  .tk-ta{width:100%;box-sizing:border-box;min-height:60vh;background:var(--code-bg,var(--bg));border:1px solid var(--border);border-radius:8px;color:var(--text);font:12.5px/1.55 ui-monospace,monospace;padding:10px 12px;resize:vertical;tab-size:2}
  .tk-ta:focus{outline:none;border-color:var(--name)}
  .tk-pick{position:relative}
  .tk-pick-res{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--bg2);border:1px solid var(--border);border-radius:8px;max-height:260px;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .tk-pick-res.on{display:block}
  .tk-pick-it{padding:6px 9px;cursor:pointer;font-size:12.5px;display:flex;gap:8px}
  .tk-pick-it:hover{background:var(--s2)}
  .tk-pick-it .k{font:10px ui-monospace,monospace;color:var(--text3);flex:0 0 auto;margin-top:2px}
  .tk-msg{font-size:12px;min-height:16px;color:var(--text3);white-space:pre-wrap}
  .tk-msg.err{color:#ff6b6b} .tk-msg.ok{color:var(--str)}
  .tk-help{font-size:12px;color:var(--text3);line-height:1.6}
  .tk-help pre{background:var(--s2);border-radius:7px;padding:8px 10px;font:11.5px/1.5 ui-monospace,monospace;color:var(--text2);overflow:auto;margin:6px 0}
  .tk-help details summary{cursor:pointer;color:var(--text2)}
  .modal-bg{position:fixed;inset:0;background:rgba(5,2,14,.72);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:28px 16px}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:820px;padding:18px 20px}
  .modal h3{margin:0 0 6px;font-size:17px}
  .mfield{margin-bottom:10px}
  .mfield label{display:block;font-size:11px;color:var(--text3);margin-bottom:4px}
  .mfield input,.mfield select,.mfield textarea{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:8px 10px;font-family:inherit}
  .mfield textarea{font-family:ui-monospace,monospace;font-size:12px}
  .rep{font-size:12px;line-height:1.6;max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:8px 0}
  .rep .bad{color:#ff6b6b}
  .tk-un{margin:4px 0 8px;color:#ff6b6b;font-size:12px}
  .tk-cands{margin-top:4px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;color:var(--text3)}
  .tk-cands .btn{padding:5px 8px;font-size:11.5px}
  @media (max-width:900px){ .tk{grid-template-columns:1fr;height:auto} .tk-split,.tk-ed{grid-template-columns:1fr} }
</style>
</head>
<body data-page="tasks">
  <div class="tk">
    <div class="tk-side">
      <h1>Задачи</h1>
      <p class="tk-lead">Что хочу сделать → вопросы → выбираешь вариант → код собирается сам. Внутри — обычные куски библиотеки.</p>
      <div class="tk-tools">
        <button class="btn ok" id="tkNew">＋ новая</button>
        <button class="btn" id="tkBulk" title="вставить пачку задач текстом (например, ответ ИИ)">пачкой</button>
        <button class="btn" onclick="window.codelabSections && codelabSections.open()" title="общее дерево разделов для задач и библиотеки">разделы</button>
        <button class="btn" id="tkPrompt" title="готовый запрос для ИИ: он напишет задачи сразу в нужном формате">⧉ промпт для ИИ</button>
      </div>
      <input class="tk-q" id="tkQ" placeholder="что хочу сделать…  (название, синонимы, раздел)">
      <div class="tk-langs" id="tkLangs"></div>
      <div class="tk-list" id="tkList"></div>
    </div>
    <div class="tk-main" id="tkMain"></div>
  </div>
  <script src="/langs.js"></script>
  <script src="/kwdict.js"></script>
  <script src="/shell.js"></script>
  <script src="/tasks-format.js"></script>
  <script src="/tasks-walk.js"></script>
  <script src="/code-check.js"></script>
  <script src="/tasks.js"></script>
  <script src="/sections-ui.js"></script>
</body>
</html>
