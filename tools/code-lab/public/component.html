<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Компонент</title>
<link rel="stylesheet" href="/style.css">
<style>
  .cwrap{padding:22px 26px;max-width:1200px}
  .back{font-size:12.5px;color:var(--text3);text-decoration:none}
  .back:hover{color:var(--acc)}
  .chead{margin:10px 0 4px}
  .chead h1{font-size:23px;margin:0 0 6px}
  .cdesc{color:var(--text2);font-size:13.5px;margin:0 0 12px;max-width:720px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
  .b{font-size:11px;padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:var(--bg2);color:var(--text2)}
  .b.type{border-color:rgba(180,92,255,.5);color:var(--kw)}
  .b.purpose{border-color:rgba(61,217,255,.4);color:var(--name)}
  .b.runtime{border-color:rgba(82,242,201,.4);color:var(--str)}
  .b.tech{border-color:rgba(255,136,0,.4);color:var(--num)}
  .b.warn{border-color:#E8895A;color:#E8895A;background:rgba(232,137,90,.08)}

  /* редактор связей «даёт/нужно» */
  .contract-ed{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:12px 15px;margin:12px 0}
  .contract-ed .ce-h{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:2px}
  .contract-ed .ce-hint{font-size:11.5px;color:var(--text3);line-height:1.5;margin-bottom:9px}
  .contract-ed .ce-row{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .contract-ed .ce-lbl{flex:0 0 52px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .contract-ed .ce-lbl.give{color:var(--str)}.contract-ed .ce-lbl.need{color:var(--num,#FF8800)}
  .contract-ed .ce-in{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:ui-monospace,monospace;font-size:12.5px;padding:7px 10px}
  .contract-ed .ce-in:focus{outline:none;border-color:var(--name)}
  .contract-ed .ce-ok{font-size:13px;width:12px}

  /* L2: контракт + необходимое */
  .brief{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  @media(max-width:720px){.brief{grid-template-columns:1fr}}
  .panel{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:13px 15px}
  .panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin:0 0 8px}
  .io{display:flex;align-items:center;gap:10px;font-family:ui-monospace,monospace;font-size:12.5px}
  .io .in{color:var(--name)}.io .arrow{color:var(--text3)}.io .out{color:var(--str)}
  .req{font-size:12.5px;color:var(--text2);line-height:1.6}
  .req-missing{color:#FFB18A}
  .req .dep{color:var(--text3)}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
  .btn{font:12px/1 ui-monospace,monospace;color:var(--text2);background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:9px 13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .btn:hover{color:var(--acc);border-color:rgba(255,0,110,.4)}
  .btn.primary{color:var(--str);border-color:rgba(82,242,201,.5)}

  /* табы */
  .tabs2{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px}
  .tabs2 button{font-size:13px;color:var(--text2);background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer}
  .tabs2 button:hover{color:var(--text)}
  .tabs2 button.on{color:var(--text);border-bottom-color:var(--acc)}
  .view{display:none}.view.on{display:block}

  .step{margin:0 0 14px}
  .step-n{font-size:12px;color:var(--text3);margin-bottom:5px}
  pre.code{background:#0E0720;border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin:0;overflow:auto;font-size:12.5px;line-height:1.6;white-space:pre}
  .codewrap{position:relative}
  .copy{position:absolute;top:8px;right:8px;font-size:11px;padding:4px 9px;border-radius:6px;background:var(--s2);border:1px solid var(--border);color:var(--text3);cursor:pointer}
  .copy:hover{color:var(--acc)}
  .k{color:#B45CFF}.s{color:#52F2C9}.n{color:#FF8800}.f{color:#3DD9FF}.c{color:#9090BB}.u{color:#9090BB}
  pre.code .w{cursor:pointer;border-radius:3px;padding:0 1px}
  pre.code .w:hover{background:rgba(255,255,255,.1)}
  pre.code .has-note{border-bottom:2px dotted var(--acc)}
  pre.code .has-var{border-bottom:2px dashed var(--name)}
  pre.code.noted{padding-left:4px}
  pre.code .crow{display:flex;align-items:flex-start}
  pre.code .crow .lng{flex:0 0 auto;width:16px;text-align:center;color:var(--border);cursor:pointer;user-select:none;margin-right:6px;font-size:11px;line-height:1.6}
  pre.code .crow:hover .lng{color:var(--text3)}
  pre.code .crow .lng.has-lnote{color:var(--acc)}
  pre.code .crow.has-lnote{background:rgba(255,0,110,.06);border-left:2px solid var(--acc);margin-left:-2px}
  pre.code .crow .cln{flex:1;white-space:pre;min-width:0}
  .note-hint{font-size:11.5px;color:var(--text3);margin-bottom:6px}
  /* страница куска по порядку: что делает → что меняешь → имена → можно/нельзя → связи */
  .cpanel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .cpanel-h{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--text);margin:0 0 10px}
  .func{font-size:14px;line-height:1.6;color:var(--text)}
  .func-out{font-size:12.5px;color:var(--text2);margin-top:6px}
  .nm-row{font-size:13px;margin:4px 0;line-height:1.7}
  .nm-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
  .nm-lbl.give{color:var(--str)} .nm-lbl.need{color:var(--num,#FF8800)}
  .nm-req{font-size:12.5px;color:var(--text2);line-height:1.6;margin-top:9px;border-top:1px solid var(--border);padding-top:9px}
  .cando{font-size:13px;line-height:1.6;color:var(--text2)}
  .link-expl{font-size:12.5px;line-height:1.7;color:var(--text2);margin-bottom:10px}
  .ct-item{display:inline-flex;align-items:center;gap:4px;margin:1px 4px 1px 0}
  .ct-ty{font-size:9px;font-family:ui-monospace,monospace;border:1px solid;border-radius:4px;padding:0 4px;line-height:1.5;opacity:.9}
  .muted{color:var(--text3)}
  .note-pop{position:absolute;z-index:70;background:var(--bg2);border:1px solid var(--acc);border-radius:10px;padding:10px;width:330px;max-height:70vh;overflow:auto;box-shadow:0 12px 34px rgba(0,0,0,.55)}
  .note-pop .np-choices{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
  .note-pop .np-choice{display:flex;align-items:baseline;gap:8px}
  .note-pop .np-choice .np-var{flex:0 0 auto}
  .note-pop .np-ce{flex:1;min-width:0;font-size:11px;color:var(--text3);line-height:1.4}
  .note-pop .np-h{font-size:13px;color:var(--text);margin-bottom:6px;font-weight:600}
  .note-pop .np-expl{font-size:12px;color:var(--text2);line-height:1.5;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 9px;margin-bottom:8px}
  .note-pop .np-sub{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin:2px 0 4px}
  .note-pop .np-vars{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  .note-pop .np-var{font:12px/1 ui-monospace,monospace;color:var(--text2);background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:5px 9px;cursor:pointer}
  .note-pop .np-var:hover{color:var(--text);border-color:var(--name)}
  .note-pop .np-var.cur{color:var(--acc);border-color:var(--acc)}
  .note-pop textarea{width:100%;min-height:64px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;padding:8px 10px;resize:vertical}
  .note-pop textarea:focus{outline:none;border-color:var(--name)}
  .note-pop .np-btns{display:flex;gap:6px;margin-top:7px}
  .note-pop .np-btns button{font-size:12px;background:var(--s2);border:1px solid var(--border);border-radius:6px;color:var(--text2);padding:6px 11px;cursor:pointer}
  .note-pop .np-btns .np-ok{color:var(--str);border-color:rgba(82,242,201,.5)}
  table.ex{border-collapse:collapse;font-size:12.5px;margin-top:6px}
  table.ex th,table.ex td{border:1px solid var(--border);padding:5px 12px;text-align:left}
  table.ex th{color:var(--text3);font-weight:600}
  .note{font-size:11.5px;color:var(--text3);margin-top:6px}
  .preview iframe{width:100%;height:200px;border:1px solid var(--border);border-radius:9px;background:#fff;margin-top:8px}

  .err{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:0;border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-top:8px;font-size:12.5px}
  .err .h{background:var(--bg2);color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:7px 11px}
  .err .cell{padding:8px 11px;border-top:1px solid var(--border)}
  .err .sym{color:#E8895A}
  .cases{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .case{font-size:11.5px;background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:4px 9px;color:var(--text2)}
  .statusline{font-size:12px;color:var(--text3);margin-top:8px}
  .st{font-family:ui-monospace,monospace;padding:1px 7px;border-radius:5px;border:1px solid var(--border)}
  .st.bad{color:#E8895A;border-color:#E8895A}

  .frags{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .frag{display:flex;gap:10px;align-items:baseline;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 11px}
  .frag .fn{font-family:ui-monospace,monospace;color:var(--name);font-size:12.5px;min-width:150px}
  .frag .ro{color:var(--text2);font-size:12.5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:12px;background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:5px 10px;color:var(--text2)}
  .about-row{margin:12px 0}
  .about-row h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin:0 0 6px}

  /* ИИ-дополнение разделов */
  .cpanel-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ai-btn{font-size:11px;color:var(--text3);background:none;border:1px dashed var(--border);border-radius:12px;padding:2px 9px;cursor:pointer;font-weight:400}
  .ai-btn:hover{color:var(--acc);border-color:var(--acc)}
  .ai-box{background:var(--bg);border:1px solid var(--acc);border-radius:10px;padding:11px 13px;margin:0 0 12px}
  .ai-h{font-size:12px;color:var(--text2);margin-bottom:8px}
  .ai-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .ai-in{flex:1;min-width:200px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12.5px;padding:7px 10px}
  .ai-in:focus,.ai-fi:focus{outline:none;border-color:var(--name)}
  .ai-go,.ai-cancel{font-size:12px;background:var(--s2);border:1px solid var(--border);border-radius:7px;color:var(--text2);padding:7px 12px;cursor:pointer}
  .ai-go{color:var(--str);border-color:rgba(82,242,201,.5)}
  .ai-go:disabled{opacity:.5;cursor:default}
  .ai-out{margin-top:10px}
  .ai-note{font-size:11.5px;color:var(--text3);margin-bottom:8px}
  .ai-err{font-size:12.5px;color:#FFB18A;margin:6px 0}
  .ai-f{display:block;margin:0 0 8px}
  .ai-fl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin-bottom:3px}
  .ai-fi{width:100%;box-sizing:border-box;background:var(--bg2);border:1px solid var(--border);border-radius:7px;color:var(--text);font:13px/1.5 system-ui,sans-serif;padding:7px 10px;resize:vertical}
  .ai-note-row{display:grid;grid-template-columns:auto 52px minmax(80px,200px) 1fr;gap:8px;align-items:start;margin-bottom:6px}
  .ai-note-row .ai-f{margin:0}
  .ai-kind{font-size:10.5px;color:var(--text3);padding-top:6px}
  .ai-key{font-size:12px;color:var(--name);padding-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ai-err-row{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:8px;align-items:start;margin-bottom:6px}
  .ai-err-row .ai-f{margin:0}
  .ai-apply{margin-top:4px}
  @media(max-width:720px){.ai-note-row,.ai-err-row{grid-template-columns:auto 1fr}}
</style>
</head>
<body data-page="inventory">
  <div class="cwrap">
    <a class="back" href="/inventory.html">← к описи</a>
    <div id="root"><div class="muted pad">загрузка…</div></div>
  </div>
  <script src="/kwdict.js"></script>
  <script src="/shell.js"></script>
  <script src="/contract.js"></script>
  <script src="/component.js"></script>
</body>
</html>
