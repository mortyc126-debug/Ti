<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шаблоны — Лаборатория кода</title>
<link rel="stylesheet" href="/style.css">
<style>
  .rcp{padding:22px 26px;max-width:1000px}
  .rcp h1{font-size:21px;margin:0 0 2px}
  .rcp .lead{color:var(--text3);font-size:12.5px;margin:0 0 16px;line-height:1.55}
  .rcp-head{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .rcp-head .cnt{font-size:12px;color:var(--text3);font-family:ui-monospace,monospace}
  .rcp-head .sp{flex:1}
  .btn{font:12px/1 ui-monospace,monospace;color:var(--text2);background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:8px 11px;cursor:pointer}
  .btn:hover{color:var(--acc);border-color:rgba(255,0,110,.4)} .btn.ok{color:var(--str);border-color:rgba(82,242,201,.4)}
  .btn.danger:hover{color:#FF6B6B;border-color:rgba(255,107,107,.4)}
  .list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .rc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 15px}
  .rc-t{font-weight:700;font-size:14.5px;color:var(--text)}
  .rc-d{font-size:12px;color:var(--text3);margin:4px 0;line-height:1.5}
  .rc-m{font-size:11px;color:var(--text3);font-family:ui-monospace,monospace;margin-bottom:9px}
  .rc-acts{display:flex;gap:6px;flex-wrap:wrap}
  .empty{color:var(--text3);font-size:13px;padding:16px 0;line-height:1.6}
  .modal-bg{position:fixed;inset:0;background:rgba(5,2,14,.72);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:28px 16px}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:620px;padding:20px 22px}
  .modal h3{margin:0 0 4px;font-size:17px}
  .modal .mh{color:var(--text3);font-size:12.5px;margin:0 0 12px;line-height:1.55}
  .mfield{margin-bottom:11px}
  .mfield label{display:block;font-size:11px;color:var(--text3);margin-bottom:4px}
  .mfield input,.mfield textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:8px 10px;font-family:inherit}
  .mfield textarea{resize:vertical}
  .mfield input:focus,.mfield textarea:focus{outline:none;border-color:var(--name)}
  .r-items{display:flex;flex-direction:column;gap:5px}
  .r-it{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:5px 8px}
  .r-it-n{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--acc);font-size:11px;font-family:ui-monospace,monospace}
  .r-it-t{flex:0 0 auto;max-width:35%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--text)}
  .r-it-note{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--border);color:var(--text2);font-size:12px;padding:3px 2px}
  .r-it-note:focus{outline:none;border-bottom-color:var(--name)}
  .mini{background:none;border:1px solid transparent;border-radius:6px;color:var(--text3);cursor:pointer;font-size:12px;padding:3px 5px}
  .mini:hover{color:var(--acc);border-color:var(--border)}
  .r-add{margin:6px 0 2px}
  .r-add input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:8px 10px}
  .r-add input:focus{outline:none;border-color:var(--name)}
  .r-results{display:flex;flex-direction:column;gap:2px;margin-top:4px;max-height:200px;overflow:auto}
  .r-res{display:flex;justify-content:space-between;gap:8px;padding:6px 9px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--text2)}
  .r-res:hover{background:var(--s2);color:var(--text)}
  .r-res-g{color:var(--text3);font-size:11px}
  .rv-steps{display:flex;flex-direction:column;gap:7px;margin:4px 0 12px}
  .rv-step{display:flex;gap:10px;align-items:flex-start}
  .rv-n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--acc);font-size:11px;font-family:ui-monospace,monospace}
  .rv-b a{color:var(--text);font-weight:600;text-decoration:none}
  .rv-b a:hover{color:var(--acc)}
  .rv-g{color:var(--text3);font-size:11px}
  .rv-note{font-size:12px;color:var(--text3);line-height:1.5;margin-top:2px}
  .mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .merr{color:#FF6B6B;font-size:12.5px;min-height:14px}
  .muted{color:var(--text3)}
</style>
</head>
<body data-page="recipes">
  <div class="rcp">
    <h1>Шаблоны</h1>
    <div class="lead">Большой шаблон — это «как собрать X»: название, описание и список кусков по порядку, каждый с заметкой зачем. Разворачивается в конструкторе связанными блоками. Грузится пачкой (код внутри — куски извлекаются сами) или собирается вручную.</div>
    <div class="rcp-head"><span class="cnt" id="cnt"></span><span class="sp"></span><button class="btn" id="bulk" title="загрузить большие шаблоны пачкой: Markdown или JSON с кодом кусков внутри — куски извлекутся сами">📥 загрузить пачкой</button><button class="btn ok" id="new">＋ новый шаблон</button></div>
    <div class="list" id="list"></div>
  </div>
  <script src="/shell.js"></script>
  <script src="/recipes.js"></script>
</body>
</html>
