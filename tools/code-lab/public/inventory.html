<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опись</title>
<link rel="stylesheet" href="/style.css">
<style>
  .inv{padding:22px 26px;max-width:1200px}
  .inv h1{font-size:21px;margin:0 0 2px}
  .inv .lead{color:var(--text3);font-size:12.5px;margin:0 0 16px}
  .inv-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
  .inv-head h2{font-size:15px;margin:0}
  .inv-head .cnt{font-size:12px;color:var(--text3);font-family:ui-monospace,monospace}
  .inv-head .sp{flex:1}
  .inv-search{background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:7px 10px;font-family:ui-monospace,monospace;min-width:180px}
  .inv-search:focus{outline:none;border-color:var(--name)}
  .inv-sel{background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:12px;padding:7px 9px;font-family:ui-monospace,monospace;cursor:pointer}
  .inv-sel:focus{outline:none;border-color:var(--name)}
  .btn{font:12px/1 ui-monospace,monospace;color:var(--text2);background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:8px 11px;cursor:pointer}
  .btn:hover{color:var(--acc);border-color:rgba(255,0,110,.4)}
  table.inv-t{width:100%;border-collapse:collapse;font-size:12.5px}
  table.inv-t th,table.inv-t td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  table.inv-t th{color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--bg)}
  table.inv-t tr:hover td{background:var(--bg2)}
  .t-title{color:var(--text);font-weight:600}
  .t-title a{color:inherit;text-decoration:none}
  .t-title a:hover{color:var(--acc)}
  .t-id{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--text3)}
  .give{color:var(--str)}.need{color:var(--num,#FF8800)}
  .ct-item{display:inline-flex;align-items:center;gap:4px;margin:1px 3px 1px 0}
  .ct-ty{font-size:9px;font-family:ui-monospace,monospace;border:1px solid;border-radius:4px;padding:0 4px;line-height:1.5;opacity:.9}
  .edit-cell{cursor:pointer}
  .edit-cell:hover{background:var(--bg2);outline:1px dashed var(--border)}
  .inv-cell-in{width:100%;background:var(--bg);border:1px solid var(--name);border-radius:6px;color:var(--text);font-family:ui-monospace,monospace;font-size:12px;padding:4px 6px}
  .inv-cell-in:focus{outline:none}
  .inv-chk{font-size:12px;color:var(--text2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .cov{display:inline-flex;gap:3px;flex-wrap:nowrap}
  .cov-d{font-size:9.5px;line-height:1;padding:3px 4px;border-radius:5px;border:1px solid var(--border);min-width:20px;text-align:center;cursor:help}
  .cov-d.on{color:var(--str);background:rgba(82,242,201,.14);border-color:rgba(82,242,201,.4)}
  .cov-d.off{color:var(--text3);background:transparent;opacity:.5}
  .cov-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--text3);margin:0 0 8px}
  .cov-legend b{color:var(--str)}
  /* импорт связей из текста */
  .modal-bg{position:fixed;inset:0;background:rgba(5,2,14,.72);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:28px 16px}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:760px;padding:20px 22px}
  .modal h3{margin:0 0 4px;font-size:17px}
  .modal .mh{color:var(--text3);font-size:12.5px;margin:0 0 12px;line-height:1.5}
  .modal textarea{width:100%;min-height:200px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.55;padding:10px 12px;resize:vertical}
  .modal textarea:focus{outline:none;border-color:var(--name)}
  .modal .mbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .fmt{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;line-height:1.6;white-space:pre-wrap;margin:8px 0}
  .lp-prev{margin-top:10px;font-size:12.5px}
  .lp-prev .lp-sec{margin:8px 0 3px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;font-size:10.5px}
  .lp-ok{color:var(--str)}.lp-bad{color:#FF6B6B}
  .lp-row{font-family:ui-monospace,monospace;font-size:12px;padding:1px 0}
  .merr{color:#FF6B6B;font-size:12.5px;margin-top:8px}
  details.rr{margin:4px 0 10px}
  details.rr summary{cursor:pointer;font-size:12px;color:var(--name)}
  .rr-box{margin-top:8px;max-height:230px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  .rr-g{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin:8px 0 3px}
  .rr-row{font-size:12px;color:var(--text2);line-height:1.5;display:flex;align-items:baseline;gap:7px}
  .rr-row b{color:var(--text)}
  .rr-dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;align-self:center}
  .rr-kw{color:var(--text3);font-family:ui-monospace,monospace;font-size:11px}
  .muted{color:var(--text3)}
  .tbl-wrap{max-height:62vh;overflow:auto;border:1px solid var(--border);border-radius:10px}
  .flow{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-bottom:10px}
  .flow h3{font-size:14px;margin:0 0 4px}
  .flow .fmeta{font-size:11.5px;color:var(--text3);margin-bottom:8px}
  .edge{font-family:ui-monospace,monospace;font-size:12px;color:var(--text2);padding:2px 0}
  .edge .arr{color:var(--acc)}
  .fnodes{font-size:11.5px;line-height:1.5;margin:2px 0 7px}
  .fnodes b{color:var(--text2)}
  .empty{color:var(--text3);font-size:13px;padding:16px 0}
  /* дерево разделов */
  .tree{padding:4px 2px}
  .tsec{margin:2px 0}
  .tsec > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;font-size:13.5px;color:var(--text)}
  .tsec > summary::-webkit-details-marker{display:none}
  .tsec > summary:hover{background:var(--bg2)}
  .tsec > summary .tri{color:var(--text3);font-size:10px;width:10px;transition:transform .12s}
  .tsec[open] > summary .tri{transform:rotate(90deg)}
  .tsec > summary .tname{font-weight:600}
  .tsec > summary .tcnt{color:var(--text3);font-size:11.5px;font-family:ui-monospace,monospace}
  .tbody{margin-left:16px;border-left:1px solid var(--border);padding-left:10px}
  .gp-piece{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:5px 8px;border-radius:7px;font-size:12.5px}
  .gp-piece:hover{background:var(--bg2)}
  .gp-piece a{color:var(--text);text-decoration:none;font-weight:600}
  .gp-piece a:hover{color:var(--acc)}
  .gp-lang{font-size:10px;color:var(--text3);font-family:ui-monospace,monospace}
  .gp-cr{font-size:11.5px}
  .gp-sp{flex:1}
  .mini{font-size:12px;line-height:1;color:var(--text3);background:none;border:1px solid transparent;border-radius:6px;padding:4px 6px;cursor:pointer}
  .mini:hover{background:var(--bg);border-color:var(--border);color:var(--acc)}
  .pc-act{white-space:nowrap;text-align:right}
  .pc-del:hover{color:#FF6B6B;border-color:rgba(255,107,107,.4)}
</style>
</head>
<body data-page="inventory">
  <div class="inv">
    <h1>Опись</h1>
    <div class="lead">Полные списки всего, что есть: кусочки кода (с контрактом «даёт/нужно») и сохранённые схемы со связями. Чтобы не гадать, есть что-то или нет.</div>

    <div class="inv-head">
      <h2>Кусочки кода</h2><span class="cnt" id="pcnt"></span>
      <span class="sp"></span>
      <select class="inv-sel" id="plang" title="язык"><option value="">язык: все</option></select>
      <select class="inv-sel" id="pgroup" title="раздел"><option value="">раздел: все</option></select>
      <select class="inv-sel" id="pfacet" title="не хватает грани"><option value="">не хватает: —</option></select>
      <label class="inv-chk"><input type="checkbox" id="pgroupview"> по разделам</label>
      <label class="inv-chk"><input type="checkbox" id="pincomplete"> только с пробелами</label>
      <input class="inv-search" id="pq" placeholder="фильтр по названию/коду…">
      <button class="btn" id="psections">📂 разделы из текста</button>
      <button class="btn" id="plinks">📥 связи из текста</button>
      <button class="btn" id="pcopy">⧉ скопировать список</button>
      <button class="btn" id="pdedup" title="схлопнуть куски с одинаковым кодом в один (оставляется самый полный)">🧹 убрать дубли</button>
    </div>
    <div class="cov-legend" id="covLegend"></div>
    <div class="tbl-wrap">
      <table class="inv-t">
        <thead><tr><th>Название</th><th>Язык</th><th>Раздел</th><th>Даёт</th><th>Нужно</th><th title="что описано: 8 граней">Описано</th><th></th></tr></thead>
        <tbody id="prows"></tbody>
      </table>
    </div>

    <div class="inv-head">
      <h2>Схемы и связи</h2><span class="cnt" id="fcnt"></span>
      <span class="sp"></span>
      <button class="btn" id="fcopy">⧉ скопировать связи</button>
    </div>
    <div id="flows"></div>
  </div>
  <script src="/shell.js"></script>
  <script src="/relations.js"></script>
  <script src="/contract.js"></script>
  <script src="/inventory.js"></script>
</body>
</html>
