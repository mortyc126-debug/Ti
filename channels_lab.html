<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Каналы · лаборатория</title>
<style>
  :root {
    --bg: #0d1017; --panel: #161c26; --border: #262f3d; --fg: #e5e9f0;
    --muted: #6f7c95; --accent: #4bc3ff;
    --up: #26d07c; --dn: #ff5b7a;
    --ch1: #7dd3fc; --ch2: #c084fc; --ch3: #fbbf24;
    --lvl: #94a3b8;
    --long: #26d07c; --short: #ff5b7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  #app { display: grid; grid-template-columns: 260px 1fr 240px; grid-template-rows: auto 1fr;
    height: 100vh; gap: 1px; background: var(--border); }
  #top { grid-column: 1 / -1; background: var(--panel); padding: 10px 14px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #top h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
  #top .sep { color: var(--muted); }
  #top button, #top select, #top input[type=file] { background: #212a38; color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; font: inherit;
    cursor: pointer; }
  #top button:hover { background: #2b3648; }
  #top button.on { background: #2b4d6b; border-color: #3a6a8f; color: #bfe5ff; }
  #top label { color: var(--muted); font-size: 12px; }
  #top input[type=number] { width: 52px; background: #212a38; color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; font: inherit; }

  #sidebar-left, #sidebar-right { background: var(--panel); padding: 10px 12px;
    overflow-y: auto; }
  #sidebar-left h2, #sidebar-right h2 { font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em; margin: 12px 0 6px; font-weight: 600; }
  #sidebar-left h2:first-child, #sidebar-right h2:first-child { margin-top: 0; }
  .field { margin-bottom: 8px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .field input[type=range] { width: 100%; }
  .field .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .field .row input[type=number] { width: 60px; background: #212a38; color: var(--fg);
    border: 1px solid var(--border); border-radius: 3px; padding: 2px 4px; font: inherit; }

  .stat { display: flex; justify-content: space-between; padding: 4px 0;
    border-bottom: 1px solid #1e2734; font-variant-numeric: tabular-nums; }
  .stat:last-child { border-bottom: none; }
  .stat .k { color: var(--muted); }
  .stat .v { font-weight: 600; }
  .stat .v.pos { color: var(--up); }
  .stat .v.neg { color: var(--dn); }

  #chart { background: var(--bg); position: relative; overflow: hidden; }
  #chart svg { display: block; width: 100%; height: 100%; user-select: none; }
  #tt { position: absolute; pointer-events: none; background: rgba(15,20,28,0.92);
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px;
    font-size: 11px; font-variant-numeric: tabular-nums; z-index: 10;
    white-space: nowrap; display: none; }
  #tt .row { display: flex; justify-content: space-between; gap: 12px; }
  #tt .k { color: var(--muted); margin-right: 6px; }

  .trades-list { max-height: none; }
  .trade { padding: 6px 8px; margin-bottom: 4px; border-radius: 3px;
    background: #1a2230; border-left: 3px solid transparent; font-size: 11px;
    cursor: pointer; }
  .trade:hover { background: #212a38; }
  .trade.long { border-left-color: var(--long); }
  .trade.short { border-left-color: var(--short); }
  .trade .head { display: flex; justify-content: space-between; font-weight: 600; }
  .trade .pnl.pos { color: var(--up); }
  .trade .pnl.neg { color: var(--dn); }
  .trade .meta { color: var(--muted); font-size: 10px; margin-top: 2px; }

  .empty-state { color: var(--muted); text-align: center; padding: 40px 12px;
    font-size: 12px; line-height: 1.6; }
  .empty-state code { background: #1a2230; padding: 1px 5px; border-radius: 3px;
    font-size: 11px; color: var(--accent); }

  .legend-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px;
    font-size: 11px; }
  .legend-swatch { width: 18px; height: 2px; }
  .legend-lvl { width: 18px; height: 0; border-top: 1px dashed var(--lvl); }
</style>

<div id="app">
  <div id="top">
    <h1>Каналы · лаборатория</h1>
    <span class="sep">·</span>
    <input type="file" id="file-input" accept=".json,.txt" title="Файл со свечами (JSON от prefetch_candles.py: [{time,open,high,low,close,volume},...])">
    <span class="sep">·</span>
    <label>тикер: <span id="ticker-name">—</span></label>
    <label>баров: <span id="bar-count">0</span></label>
    <span class="sep">·</span>
    <button id="btn-demo" title="Синтетические свечи с несколькими сегментами тренда + флэт">Демо</button>
    <span class="sep">·</span>
    <label>слои:</label>
    <button id="toggle-channels" class="on">каналы</button>
    <select id="ch-style" title="Стиль каналов: piecewise = прямые линии на непересекающихся сегментах (как в TradingView Linear Regression Channel), rolling = σ-лента вокруг скользящей регрессии (по сути Bollinger)">
      <option value="piecewise" selected>прямые</option>
      <option value="rolling">лента σ</option>
    </select>
    <button id="toggle-levels" class="on">уровни</button>
    <button id="toggle-trades" class="on">сделки</button>
    <span class="sep">·</span>
    <label>окно: <input type="number" id="view-len" value="500" min="50" max="20000" step="50" title="Сколько баров показывать одновременно"></label>
    <button id="btn-view-all" title="Показать всю историю (медленно на больших файлах)">всё</button>
    <button id="btn-view-end" title="Прыгнуть к концу истории">→ конец</button>
    <span id="view-pos" style="color:var(--muted);font-size:11px">—</span>
  </div>

  <div id="sidebar-left">
    <h2>Каналы (регрессия ± N σ)</h2>
    <div class="field">
      <div class="row"><label>окно 1</label><input type="number" id="ch-w1" value="30" min="10" max="500" step="5"></div>
      <div class="row"><label>окно 2</label><input type="number" id="ch-w2" value="80" min="20" max="500" step="5"></div>
      <div class="row"><label>окно 3</label><input type="number" id="ch-w3" value="200" min="40" max="1000" step="10"></div>
      <div class="row"><label>ширина k σ</label><input type="number" id="ch-k" value="2" min="1" max="4" step="0.25"></div>
    </div>
    <h2>Уровни (кластеризация)</h2>
    <div class="field">
      <div class="row"><label>окно свинга ±N</label><input type="number" id="lv-pivot" value="5" min="2" max="30" step="1"></div>
      <div class="row"><label>слить в ATR</label><input type="number" id="lv-merge" value="0.5" min="0.1" max="2" step="0.05"></div>
      <div class="row"><label>мин касаний</label><input type="number" id="lv-min" value="3" min="2" max="10" step="1"></div>
    </div>
    <h2>Сигналы</h2>
    <div class="field">
      <div class="row"><label>тейк (ATR)</label><input type="number" id="tr-take" value="1.5" min="0.5" max="5" step="0.1"></div>
      <div class="row"><label>стоп (ATR)</label><input type="number" id="tr-stop" value="0.75" min="0.25" max="3" step="0.05"></div>
      <div class="row"><label>горизонт</label><input type="number" id="tr-horizon" value="24" min="6" max="200" step="2"></div>
      <div class="row"><label>ER мах.</label><input type="number" id="tr-er-max" value="0.35" min="0.1" max="0.8" step="0.05"></div>
    </div>
    <div class="legend-row" style="margin-top:10px"><span class="legend-swatch" style="background:var(--ch1)"></span> микро (окно 1)</div>
    <div class="legend-row"><span class="legend-swatch" style="background:var(--ch2)"></span> средний (окно 2)</div>
    <div class="legend-row"><span class="legend-swatch" style="background:var(--ch3)"></span> большой (окно 3)</div>
    <div class="legend-row"><span class="legend-lvl"></span> уровни (кластер)</div>
  </div>

  <div id="chart">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="tt"></div>
  </div>

  <div id="sidebar-right">
    <h2>Статистика</h2>
    <div class="stat"><span class="k">сигналов</span><span class="v" id="s-total">—</span></div>
    <div class="stat"><span class="k">лонгов</span><span class="v" id="s-long">—</span></div>
    <div class="stat"><span class="k">шортов</span><span class="v" id="s-short">—</span></div>
    <div class="stat"><span class="k">win % направл.</span><span class="v" id="s-acc">—</span></div>
    <div class="stat"><span class="k">win % брекета</span><span class="v" id="s-win">—</span></div>
    <div class="stat"><span class="k">exp (ATR)</span><span class="v" id="s-exp">—</span></div>
    <h2>Сделки</h2>
    <div id="trades-list" class="trades-list">
      <div class="empty-state">Загрузи файл со свечами или нажми «Демо»</div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// channels_lab.html — визуальный стенд «канал в канале + уровни + сигналы».
//
// Каналы: линейная регрессия close по окну W, границы = центр ± k·σ (σ по
// residuals). Три вложенных окна (default 30/80/200). Считается на каждом баре
// причинно (только по [0..i]) — картинка на бар i использует лишь данные до i,
// без заглядывания в будущее. Границы канала на баре i отражают то, что
// пользователь видел бы, торгуя в реальном времени.
//
// Уровни: локальные экстремумы (±N баров ни у одного бара нет ниже/выше)
// собираются в кластеры по цене (в пределах merge·ATR). Кластер с ≥ мин
// касаний = уровень, положение = медиана. Также causal: на баре i
// используются только экстремумы, подтверждённые до i-N (лаг подтверждения).
//
// Сигналы: лонг когда цена коснулась нижней границы БОЛЬШОГО канала (окно 3)
// в состоянии ranging (ER<max) — mean-reversion от границы канала. Аналогично
// шорт для верхней. Confluence с уровнем (в пределах 0.5·ATR) = метка ★.
// Простой backtest: вход по close сигнального бара, выход тейк/стоп ATR или
// тайм-выход через horizon.
//
// Формат свечей: JSON [{time, open, high, low, close, volume}, ...] — тот
// же, что пишет prefetch_candles.py в invest-bot/data/candle_cache. time может
// быть ISO-строкой или unix-секундами.
// ═══════════════════════════════════════════════════════════════════════════
'use strict';

const $ = id => document.getElementById(id);

let STATE = {
  bars: [],
  ticker: '',
  atr: [],           // ATR серия по всей истории (для причинных расчётов уровней)
  channels: [],      // [[{ch1, ch2, ch3} per bar]]
  levels: [],        // [{price, touches, first, last}]
  signals: [],       // [{i, dir, entry, price, tp, sl, confluence, exit}]
  layers: { channels: true, levels: true, trades: true },
  viewStart: 0,      // индекс левого края видимого окна
};

// ── math ────────────────────────────────────────────────────────────────────
function atrSeries(bars, per) {
  const n = bars.length, out = new Array(n).fill(null);
  if (n < 2) return out;
  const tr = new Array(n);
  tr[0] = bars[0].high - bars[0].low;
  for (let i = 1; i < n; i++) {
    const pc = bars[i - 1].close;
    tr[i] = Math.max(bars[i].high - bars[i].low, Math.abs(bars[i].high - pc), Math.abs(bars[i].low - pc));
  }
  if (n < per) return out;
  let s = 0; for (let i = 0; i < per; i++) s += tr[i];
  out[per - 1] = s / per;
  for (let i = per; i < n; i++) out[i] = (out[i - 1] * (per - 1) + tr[i]) / per;
  return out;
}
// Линейная регрессия close по последним W барам, возвращает {slope, intercept, sigma, top, bot}
// где x = 0..W-1 (относительное время), y = close, границы = центр в конце ± k·σ.
function regChannel(bars, i, W, k) {
  if (i < W - 1) return null;
  const start = i - W + 1;
  let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (let j = 0; j < W; j++) { const x = j, y = bars[start + j].close;
    sx += x; sy += y; sxx += x * x; sxy += x * y; }
  const mx = sx / W, my = sy / W;
  const denom = sxx - sx * mx;
  const slope = denom > 0 ? (sxy - sx * my) / denom : 0;
  const intercept = my - slope * mx;
  let ss = 0;
  for (let j = 0; j < W; j++) { const y = bars[start + j].close;
    const r = y - (slope * j + intercept); ss += r * r; }
  const sigma = Math.sqrt(ss / W);
  const centerNow = slope * (W - 1) + intercept;
  const centerPrev = intercept; // центр в начале окна
  return { slope, intercept, sigma, centerNow, centerPrev,
           topNow: centerNow + k * sigma, botNow: centerNow - k * sigma,
           topPrev: centerPrev + k * sigma, botPrev: centerPrev - k * sigma };
}
// Efficiency ratio за W баров — тренд/боковик.
function er(bars, i, W) {
  if (i < W) return null;
  let d = 0; for (let j = i - W + 1; j <= i; j++) d += Math.abs(bars[j].close - bars[j - 1].close);
  if (d === 0) return 0;
  return Math.abs(bars[i].close - bars[i - W].close) / d;
}

// ── уровни: локальные экстремумы + кластеризация ───────────────────────────
function pivotPoints(bars, N) {
  // Пивот высокий: bars[i].high строго максимум в [i-N .. i+N].
  const n = bars.length, out = [];
  for (let i = N; i < n - N; i++) {
    let hi = true, lo = true;
    for (let j = i - N; j <= i + N; j++) {
      if (j === i) continue;
      if (bars[j].high >= bars[i].high) hi = false;
      if (bars[j].low <= bars[i].low) lo = false;
      if (!hi && !lo) break;
    }
    if (hi) out.push({ i, price: bars[i].high, kind: 'H' });
    if (lo) out.push({ i, price: bars[i].low, kind: 'L' });
  }
  return out;
}
// Кластеризация пивотов: соседи в пределах merge·ATR сливаются. Возвращает
// уровни [{price, touches, first, last}].
function clusterLevels(pivots, atrArr, mergeAtr, minTouches) {
  if (!pivots.length) return [];
  const items = pivots.slice().sort((a, b) => a.price - b.price);
  const out = [];
  let cur = null;
  for (const p of items) {
    const a = atrArr[p.i] || 1;
    if (!cur) { cur = { prices: [p.price], is: [p.i] }; continue; }
    const mid = cur.prices.reduce((s, v) => s + v, 0) / cur.prices.length;
    if (Math.abs(p.price - mid) <= mergeAtr * a) {
      cur.prices.push(p.price); cur.is.push(p.i);
    } else {
      if (cur.is.length >= minTouches) {
        const ps = cur.prices.slice().sort((a, b) => a - b);
        out.push({ price: ps[ps.length >> 1], touches: cur.is.length,
                   first: Math.min(...cur.is), last: Math.max(...cur.is) });
      }
      cur = { prices: [p.price], is: [p.i] };
    }
  }
  if (cur && cur.is.length >= minTouches) {
    const ps = cur.prices.slice().sort((a, b) => a - b);
    out.push({ price: ps[ps.length >> 1], touches: cur.is.length,
               first: Math.min(...cur.is), last: Math.max(...cur.is) });
  }
  return out;
}

// ── сигналы: касание границы БОЛЬШОГО канала в ranging режиме ───────────────
function detectSignals(bars, chSeries, levels, atrArr, params, iStart, iEnd) {
  const { erMax, take, stop, horizon } = params;
  const signals = [];
  const n = bars.length;
  const lo = iStart != null ? iStart : 0;
  const hi = iEnd != null ? iEnd : n;
  for (let i = lo; i < hi; i++) {
    const ch = chSeries[i] && chSeries[i].ch3; if (!ch) continue;
    const a = atrArr[i]; if (!a || a <= 0) continue;
    const erv = er(bars, i, 60);
    if (erv == null || erv >= erMax) continue; // фильтр тренда

    let dir = 0;
    // Касание нижней границы → лонг (mean-reversion вверх)
    if (bars[i].low <= ch.botNow && bars[i].close > ch.botNow - a * 0.2) dir = 1;
    // Касание верхней → шорт
    else if (bars[i].high >= ch.topNow && bars[i].close < ch.topNow + a * 0.2) dir = -1;
    if (!dir) continue;

    // Причинный уровень: только уровни у которых last <= i-N (подтверждены).
    // Levels пересчитываются на каждом баре ниже (в render/detect чейне), сюда
    // приходят levels посчитанные ДО этого бара с учётом лага пивотов.
    let confluence = false;
    const target = dir > 0 ? ch.botNow : ch.topNow;
    for (const lv of levels) {
      if (lv.last >= i) continue; // будущее — не учитываем
      if (Math.abs(lv.price - target) <= a * 0.5) { confluence = true; break; }
    }

    const entry = bars[i].close;
    const tp = entry + dir * take * a, sl = entry - dir * stop * a;
    // Прогоняем сделку вперёд (это ретроспективный расчёт исхода для показа
    // цвета сделки; сам факт входа "видно" на баре i без look-ahead).
    let exit = null, exitBar = null, reason = null;
    for (let j = i + 1; j <= Math.min(i + horizon, n - 1); j++) {
      const hi = bars[j].high, lo = bars[j].low;
      if (dir > 0) {
        if (lo <= sl) { exit = sl; exitBar = j; reason = 'стоп'; break; }
        if (hi >= tp) { exit = tp; exitBar = j; reason = 'тейк'; break; }
      } else {
        if (hi >= sl) { exit = sl; exitBar = j; reason = 'стоп'; break; }
        if (lo <= tp) { exit = tp; exitBar = j; reason = 'тейк'; break; }
      }
    }
    if (exit == null && i + horizon < n) {
      exit = bars[i + horizon].close; exitBar = i + horizon; reason = 'тайм';
    }
    const pnl = exit != null ? dir * (exit - entry) / a : null;
    signals.push({ i, dir, entry, tp, sl, atr: a, exit, exitBar, reason, pnl, confluence });
  }
  return signals;
}

// ── причинный расчёт каналов и уровней на каждом баре ──────────────────────
// Каналы и сигналы считаются только для баров, попадающих в видимое окно
// (с запасом = максимальный горизонт сделки, чтобы exit-бары тоже посчитались
// корректно). Это делает пересчёт мгновенным даже на 100k+ баров. Уровни —
// на всей истории (кластеризация быстрая, нужны для контекста).
function computeAll() {
  const bars = STATE.bars;
  const n = bars.length;
  if (n < 20) { STATE.channels = []; STATE.levels = []; STATE.signals = []; return; }
  const W1 = +$('ch-w1').value, W2 = +$('ch-w2').value, W3 = +$('ch-w3').value;
  const k = +$('ch-k').value;
  const lvN = +$('lv-pivot').value, lvMerge = +$('lv-merge').value, lvMin = +$('lv-min').value;
  const take = +$('tr-take').value, stop = +$('tr-stop').value;
  const horizon = +$('tr-horizon').value, erMax = +$('tr-er-max').value;
  const atrArr = atrSeries(bars, 14);
  STATE.atr = atrArr;

  // Видимое окно + запас на horizon: exit-бары могут выходить за правый край.
  const viewLen = Math.min(n, Math.max(50, +$('view-len').value | 0));
  const vs = Math.max(0, Math.min(n - viewLen, STATE.viewStart | 0));
  const ve = Math.min(n, vs + viewLen + horizon);
  const chSeries = new Array(n); // sparse — только видимый диапазон
  for (let i = vs; i < ve; i++) {
    chSeries[i] = {
      ch1: regChannel(bars, i, W1, k),
      ch2: regChannel(bars, i, W2, k),
      ch3: regChannel(bars, i, W3, k),
    };
  }
  STATE.channels = chSeries;

  // Уровни: на всей истории, кластеризация быстрая. detectSignals фильтрует
  // по lv.last < i (уровень "виден" только когда все касания в прошлом).
  const pivots = pivotPoints(bars, lvN);
  STATE.levels = clusterLevels(pivots, atrArr, lvMerge, lvMin);

  // Сигналы только на видимом окне
  STATE.signals = detectSignals(bars, chSeries, STATE.levels, atrArr,
    { erMax, take, stop, horizon }, vs, Math.min(n, vs + viewLen));
}

// ── отрисовка SVG ──────────────────────────────────────────────────────────
function render() {
  try { renderImpl(); }
  catch (e) {
    console.error('render() упал:', e);
    const svg = $('svg');
    svg.innerHTML = `<text x="20" y="30" fill="#ff6a8b" font-size="14" font-family="ui-monospace,monospace">render error: ${(e && e.message || e).toString().replace(/[<>&]/g,'')}</text>`;
  }
}
function renderImpl() {
  const svg = $('svg');
  const barsAll = STATE.bars;
  const rect = svg.getBoundingClientRect();
  const W = rect.width | 0, H = rect.height | 0;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';
  if (!barsAll.length || W < 100) return;

  // Видимое окно: [viewStart, viewStart+viewLen). Всё вычисляется на barsAll
  // (причинно от начала истории), но рисуется только видимое.
  const viewLen = Math.min(barsAll.length, Math.max(50, +$('view-len').value | 0));
  const vs = Math.max(0, Math.min(barsAll.length - viewLen, STATE.viewStart | 0));
  const ve = Math.min(barsAll.length, vs + viewLen);
  STATE.viewStart = vs;
  const bars = barsAll.slice(vs, ve);
  $('view-pos').textContent = `${vs}..${ve - 1} / ${barsAll.length}`;

  // Padding: слева/справа/сверху/снизу
  const PL = 8, PR = 78, PT = 12, PB = 22;
  const plotW = W - PL - PR, plotH = H - PT - PB;

  let minP = Infinity, maxP = -Infinity;
  for (const b of bars) { if (b.low < minP) minP = b.low; if (b.high > maxP) maxP = b.high; }
  if (STATE.layers.channels) {
    // Расширим bounds по каналам В ВИДИМОМ ОКНЕ (не по последнему бару всей истории)
    for (let idx = 0; idx < bars.length; idx++) {
      const ch = STATE.channels[vs + idx] && STATE.channels[vs + idx].ch3;
      if (!ch) continue;
      if (ch.topNow > maxP) maxP = ch.topNow;
      if (ch.botNow < minP) minP = ch.botNow;
    }
  }
  const pad = (maxP - minP) * 0.03;
  minP -= pad; maxP += pad;
  const priceRange = maxP - minP || 1;

  // idx — индекс в видимом окне (0..bars.length-1). x(idx) — экранная координата.
  const x = idx => PL + (idx / Math.max(1, bars.length - 1)) * plotW;
  const y = p => PT + (1 - (p - minP) / priceRange) * plotH;
  const bw = Math.max(1.5, plotW / bars.length * 0.72);

  // Оси/сетка (простая) — 5 горизонтальных линий с ценами справа
  let axis = '';
  for (let g = 0; g <= 4; g++) {
    const py = PT + (g / 4) * plotH;
    const pv = maxP - (g / 4) * priceRange;
    axis += `<line x1="${PL}" y1="${py}" x2="${W - PR}" y2="${py}" stroke="#1e2734" stroke-width="1"/>`;
    axis += `<text x="${W - PR + 4}" y="${py + 4}" fill="#6f7c95" font-size="10" font-family="ui-monospace,monospace">${pv.toFixed(pv > 100 ? 1 : 3)}</text>`;
  }

  // Свечи
  let candles = '';
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    const cx = x(i);
    const up = b.close >= b.open;
    const col = up ? 'var(--up)' : 'var(--dn)';
    const yh = y(b.high), yl = y(b.low);
    const yo = y(b.open), yc = y(b.close);
    const ybt = Math.min(yo, yc), ytp = Math.max(yo, yc);
    candles += `<line x1="${cx}" y1="${yh}" x2="${cx}" y2="${yl}" stroke="${col}" stroke-width="1"/>`;
    candles += `<rect x="${cx - bw / 2}" y="${ybt}" width="${bw}" height="${Math.max(1, ytp - ybt)}" fill="${col}"/>`;
  }

  // Свечи должны попасть на экран ДАЖЕ если каналы или уровни упадут при
  // отрисовке (я делаю try вокруг каждого блока ниже, а innerHTML пишу один
  // раз в конце — так что svg заполняется в самом финале). Если один из
  // блоков бросит — соответствующая часть будет пустой, но остальное
  // отрисуется.
  const safe = (fn, label) => {
    try { return fn(); }
    catch (e) { console.error(label + ' failed:', e); return ''; }
  };
  // Каналы. Два стиля:
  //   piecewise (default): для каждого окна W разбиваем видимую историю на
  //     НЕПЕРЕСЕКАЮЩИЕСЯ сегменты по W баров. Для каждого сегмента канал —
  //     ПРЯМАЯ линия (центр + top + bot), tangent сегменту. Так выглядит
  //     Linear Regression Channel в TradingView: настоящий "канал", а не
  //     σ-лента. + одна яркая линия для "канала СЕЙЧАС" (последние W баров,
  //     как видит трейдер в текущий момент, обновляется на каждом баре).
  //   rolling: старое поведение — соединяем правые края скользящих
  //     регрессий, получается гладкая лента (по факту Bollinger на регрессии).
  const channelSvg = safe(() => {
    if (!STATE.layers.channels) return '';
    let out = '';
    const styleEl = $('ch-style');
    const style = styleEl ? styleEl.value : 'piecewise';
    const drawCh = (color, opacity, key, W) => {
      if (style === 'rolling') {
        let pathCenter = '', pathTop = '', pathBot = '';
        for (let idx = 0; idx < bars.length; idx++) {
          const ch = STATE.channels[vs + idx] && STATE.channels[vs + idx][key];
          if (!ch) continue;
          const cx = x(idx);
          pathCenter += (pathCenter ? 'L' : 'M') + cx + ',' + y(ch.centerNow);
          pathTop += (pathTop ? 'L' : 'M') + cx + ',' + y(ch.topNow);
          pathBot += (pathBot ? 'L' : 'M') + cx + ',' + y(ch.botNow);
        }
        if (pathCenter) {
          out += `<path d="${pathTop}" fill="none" stroke="${color}" stroke-width="1" opacity="${opacity}"/>`;
          out += `<path d="${pathBot}" fill="none" stroke="${color}" stroke-width="1" opacity="${opacity}"/>`;
          out += `<path d="${pathCenter}" fill="none" stroke="${color}" stroke-width="0.6" opacity="${opacity * 0.6}" stroke-dasharray="3,3"/>`;
        }
        return;
      }
      // piecewise: сегменты выравниваем к вcей истории (не только к видимому окну), чтобы
      // границы сегментов не "перескакивали" при скролле. Сегмент [k*W .. k*W+W-1] в barsAll.
      const kStart = Math.floor(vs / W);
      const kEnd = Math.floor((ve - 1) / W) + 1;
      for (let k = kStart; k < kEnd; k++) {
        const segEnd = k * W + W - 1;
        if (segEnd >= barsAll.length) break;
        // причинный канал В КОНЦЕ сегмента (уже посчитан для видимого окна)
        const ch = STATE.channels[segEnd] && STATE.channels[segEnd][key];
        if (!ch) continue;
        const segStart = k * W;
        // Рисуем прямые ТОЛЬКО в пределах видимого окна.
        const drawFrom = Math.max(segStart, vs), drawTo = Math.min(segEnd, ve - 1);
        // ch хранит intercept, slope, sigma. Пересчитываем цены в drawFrom / drawTo
        // относительно начала СЕГМЕНТА (t=0 в segStart, t=W-1 в segEnd).
        const tFrom = drawFrom - segStart, tTo = drawTo - segStart;
        const yc1 = ch.slope * tFrom + ch.intercept, yc2 = ch.slope * tTo + ch.intercept;
        const yt1 = yc1 + k_sigma * ch.sigma, yt2 = yc2 + k_sigma * ch.sigma;
        const yb1 = yc1 - k_sigma * ch.sigma, yb2 = yc2 - k_sigma * ch.sigma;
        const x1 = x(drawFrom - vs), x2 = x(drawTo - vs);
        out += `<line x1="${x1}" y1="${y(yt1)}" x2="${x2}" y2="${y(yt2)}" stroke="${color}" stroke-width="1" opacity="${opacity}"/>`;
        out += `<line x1="${x1}" y1="${y(yb1)}" x2="${x2}" y2="${y(yb2)}" stroke="${color}" stroke-width="1" opacity="${opacity}"/>`;
        out += `<line x1="${x1}" y1="${y(yc1)}" x2="${x2}" y2="${y(yc2)}" stroke="${color}" stroke-width="0.6" opacity="${opacity * 0.5}" stroke-dasharray="3,3"/>`;
      }
      // Плюс "канал СЕЙЧАС" — на последнем баре видимого окна, ярче остальных.
      // Показывает актуальную оценку канала (то что трейдер видит в момент t=ve-1).
      const nowBar = ve - 1;
      const chNow = STATE.channels[nowBar] && STATE.channels[nowBar][key];
      if (chNow && nowBar >= W - 1) {
        const fromBar = Math.max(vs, nowBar - W + 1);
        const tFrom = fromBar - (nowBar - W + 1), tTo = W - 1;
        const yc1 = chNow.slope * tFrom + chNow.intercept, yc2 = chNow.slope * tTo + chNow.intercept;
        const yt1 = yc1 + k_sigma * chNow.sigma, yt2 = yc2 + k_sigma * chNow.sigma;
        const yb1 = yc1 - k_sigma * chNow.sigma, yb2 = yc2 - k_sigma * chNow.sigma;
        const x1 = x(fromBar - vs), x2 = x(nowBar - vs);
        out += `<line x1="${x1}" y1="${y(yt1)}" x2="${x2}" y2="${y(yt2)}" stroke="${color}" stroke-width="1.8" opacity="0.95"/>`;
        out += `<line x1="${x1}" y1="${y(yb1)}" x2="${x2}" y2="${y(yb2)}" stroke="${color}" stroke-width="1.8" opacity="0.95"/>`;
      }
    };
    const k_sigma = +$('ch-k').value;
    const W1 = +$('ch-w1').value, W2 = +$('ch-w2').value, W3 = +$('ch-w3').value;
    drawCh('var(--ch1)', 0.55, 'ch1', W1);
    drawCh('var(--ch2)', 0.65, 'ch2', W2);
    drawCh('var(--ch3)', 0.8, 'ch3', W3);
    return out;
  }, 'channels');

  // Уровни: показываем только те, чей ценовой диапазон пересекается с видимым
  // окном, и первое касание которых — до конца видимого окна (иначе уровень ещё
  // не существовал в этом временном промежутке).
  let levelsSvg = '';
  if (STATE.layers.levels) {
    const veIdx = vs + bars.length - 1;
    for (const lv of STATE.levels) {
      if (lv.first > veIdx) continue;         // уровень появится позже видимого окна
      if (lv.price < minP || lv.price > maxP) continue; // за пределами Y-диапазона
      const py = y(lv.price);
      // экранный x начала касания: если уровень начался левее видимого окна — рисуем от левого края
      const x0 = lv.first < vs ? PL : x(lv.first - vs);
      const alpha = Math.min(1, 0.4 + lv.touches * 0.1);
      levelsSvg += `<line x1="${x0}" y1="${py}" x2="${W - PR}" y2="${py}" stroke="var(--lvl)" stroke-width="1" stroke-dasharray="2,3" opacity="${alpha}"/>`;
      levelsSvg += `<text x="${W - PR - 4}" y="${py - 2}" fill="var(--lvl)" font-size="9" font-family="ui-monospace,monospace" text-anchor="end">×${lv.touches}</text>`;
    }
  }

  // Сделки: только в видимом окне
  let tradesSvg = '';
  if (STATE.layers.trades) {
    for (const s of STATE.signals) {
      if (s.i < vs || s.i >= ve) continue;
      const idxS = s.i - vs;
      const px = x(idxS), py = y(s.entry);
      const color = s.dir > 0 ? 'var(--long)' : 'var(--short)';
      const arrow = s.dir > 0 ? `M${px},${py + 8} L${px - 4},${py + 14} L${px + 4},${py + 14} Z`
                              : `M${px},${py - 8} L${px - 4},${py - 14} L${px + 4},${py - 14} Z`;
      tradesSvg += `<path d="${arrow}" fill="${color}" opacity="0.85"/>`;
      if (s.confluence) {
        tradesSvg += `<circle cx="${px}" cy="${py + (s.dir > 0 ? 14 : -14)}" r="5" fill="none" stroke="${color}" stroke-width="1" opacity="0.7"/>`;
      }
      // Линия entry→exit: exit может быть вне окна — тогда обрезаем до правого края
      if (s.exit != null && s.exitBar != null) {
        const exIdx = s.exitBar - vs;
        if (exIdx >= 0) {
          const ex = x(Math.min(exIdx, bars.length - 1)), ey = y(s.exit);
          const pnlPos = s.pnl != null && s.pnl > 0;
          const lineColor = pnlPos ? 'var(--up)' : (s.pnl < 0 ? 'var(--dn)' : '#6f7c95');
          tradesSvg += `<line x1="${px}" y1="${py}" x2="${ex}" y2="${ey}" stroke="${lineColor}" stroke-width="0.8" opacity="0.55" stroke-dasharray="2,2"/>`;
          if (exIdx < bars.length) tradesSvg += `<circle cx="${ex}" cy="${ey}" r="2" fill="${lineColor}" opacity="0.7"/>`;
        }
      }
    }
  }

  svg.innerHTML = axis + channelSvg + levelsSvg + candles + tradesSvg;
  renderStats();
  renderTradesList();
}

function renderStats() {
  const sigs = STATE.signals;
  $('s-total').textContent = sigs.length;
  const longs = sigs.filter(s => s.dir > 0).length;
  const shorts = sigs.filter(s => s.dir < 0).length;
  $('s-long').textContent = longs; $('s-short').textContent = shorts;
  const closed = sigs.filter(s => s.pnl != null);
  if (!closed.length) { $('s-acc').textContent = '—'; $('s-win').textContent = '—'; $('s-exp').textContent = '—'; return; }
  const wins = closed.filter(s => s.pnl > 0).length;
  const winPct = (wins / closed.length * 100).toFixed(1);
  const expAvg = closed.reduce((s, x) => s + x.pnl, 0) / closed.length;
  // acc — угадывание направления по ходу через horizon (независимо от брекета)
  let hits = 0, hn = 0;
  for (const s of closed) {
    const h = +$('tr-horizon').value;
    const j = s.i + h; if (j >= STATE.bars.length) continue;
    const fut = STATE.bars[j].close - s.entry; if (fut === 0) continue;
    hn++; if ((s.dir > 0 && fut > 0) || (s.dir < 0 && fut < 0)) hits++;
  }
  const accPct = hn ? (hits / hn * 100).toFixed(1) : '—';
  const winEl = $('s-win'), expEl = $('s-exp');
  $('s-acc').textContent = accPct + '%';
  winEl.textContent = winPct + '%';
  winEl.className = 'v ' + (wins / closed.length > 0.33 ? 'pos' : 'neg');
  expEl.textContent = (expAvg >= 0 ? '+' : '') + expAvg.toFixed(3);
  expEl.className = 'v ' + (expAvg > 0 ? 'pos' : 'neg');
}

function renderTradesList() {
  const el = $('trades-list');
  if (!STATE.signals.length) {
    el.innerHTML = '<div class="empty-state">Нет сигналов. Проверь параметры каналов/ER.</div>';
    return;
  }
  const rows = STATE.signals.slice().reverse().map((s, idx) => {
    const iBar = STATE.bars.length - 1 - (STATE.signals.length - 1 - idx);  // индекс для клика
    const dt = s.i;
    const pnlClass = s.pnl == null ? '' : (s.pnl > 0 ? 'pos' : 'neg');
    const pnlText = s.pnl == null ? 'открыта' : (s.pnl >= 0 ? '+' : '') + s.pnl.toFixed(2) + ' ATR';
    const dirTxt = s.dir > 0 ? '▲ лонг' : '▼ шорт';
    const conf = s.confluence ? ' ★' : '';
    const time = STATE.bars[s.i].time || `бар ${s.i}`;
    return `<div class="trade ${s.dir > 0 ? 'long' : 'short'}" data-bar="${s.i}">
      <div class="head"><span>${dirTxt}${conf}</span><span class="pnl ${pnlClass}">${pnlText}</span></div>
      <div class="meta">${time} · вход ${s.entry.toFixed(3)} · ${s.reason || 'открыта'}</div>
    </div>`;
  });
  el.innerHTML = rows.join('');
}

// ── tooltip + pan/zoom ─────────────────────────────────────────────────────
$('svg').addEventListener('mousemove', ev => {
  const barsAll = STATE.bars; if (!barsAll.length) return;
  const svg = $('svg');
  const rect = svg.getBoundingClientRect();
  const PL = 8, PR = 78;
  const plotW = rect.width - PL - PR;
  const relX = ev.clientX - rect.left - PL;
  const viewLen = Math.min(barsAll.length, Math.max(50, +$('view-len').value | 0));
  const vs = STATE.viewStart | 0;
  const idxInView = Math.round(relX / plotW * (viewLen - 1));
  const i = vs + idxInView;
  if (i < 0 || i >= barsAll.length) return;
  const b = barsAll[i];
  const ch = STATE.channels[i];
  const tt = $('tt');
  tt.style.display = 'block';
  tt.style.left = (ev.clientX - rect.left + 12) + 'px';
  tt.style.top = (ev.clientY - rect.top + 12) + 'px';
  let html = `<div class="row"><span class="k">бар</span><span>${i} · ${b.time || ''}</span></div>` +
    `<div class="row"><span class="k">O/H/L/C</span><span>${b.open.toFixed(3)}/${b.high.toFixed(3)}/${b.low.toFixed(3)}/${b.close.toFixed(3)}</span></div>`;
  if (ch && ch.ch3) html += `<div class="row"><span class="k">канал 3</span><span>[${ch.ch3.botNow.toFixed(3)} .. ${ch.ch3.topNow.toFixed(3)}]</span></div>`;
  if (ch && ch.ch2) html += `<div class="row"><span class="k">канал 2</span><span>[${ch.ch2.botNow.toFixed(3)} .. ${ch.ch2.topNow.toFixed(3)}]</span></div>`;
  if (ch && ch.ch1) html += `<div class="row"><span class="k">канал 1</span><span>[${ch.ch1.botNow.toFixed(3)} .. ${ch.ch1.topNow.toFixed(3)}]</span></div>`;
  tt.innerHTML = html;
});
$('svg').addEventListener('mouseleave', () => { $('tt').style.display = 'none'; });

// Pan drag: тянем мышью влево-вправо → сдвигаем viewStart
(() => {
  const svg = $('svg');
  let dragging = false, startX = 0, startVs = 0;
  svg.addEventListener('mousedown', ev => {
    if (ev.button !== 0) return;
    dragging = true; startX = ev.clientX; startVs = STATE.viewStart;
    svg.style.cursor = 'grabbing';
  });
  // Панорамирование: throttle через rAF, чтобы drag на 174k баров не тормозил.
  // При drag только двигаем окно и рендерим (каналы уже посчитаны). Тяжёлый
  // пересчёт делаем один раз при mouseup — тогда покажутся сигналы для нового окна.
  let pendingFrame = false;
  const scheduleRender = () => {
    if (pendingFrame) return;
    pendingFrame = true;
    requestAnimationFrame(() => { pendingFrame = false; render(); });
  };
  window.addEventListener('mousemove', ev => {
    if (!dragging) return;
    const rect = svg.getBoundingClientRect();
    const viewLen = Math.max(50, +$('view-len').value | 0);
    const barsPerPx = viewLen / (rect.width - 86);
    STATE.viewStart = Math.max(0, Math.min(STATE.bars.length - viewLen,
      startVs - Math.round((ev.clientX - startX) * barsPerPx)));
    scheduleRender();
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false; svg.style.cursor = '';
    recompute(); // пересчёт каналов/сигналов на новом окне
  });
  // Zoom колесом: центрируем вокруг курсора
  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const rect = svg.getBoundingClientRect();
    const viewLen = Math.max(50, +$('view-len').value | 0);
    const relX = (ev.clientX - rect.left - 8) / (rect.width - 86);
    const anchorBar = STATE.viewStart + relX * viewLen;
    const factor = ev.deltaY > 0 ? 1.25 : 0.8;
    const newLen = Math.max(50, Math.min(STATE.bars.length,
      Math.round(viewLen * factor)));
    $('view-len').value = newLen;
    STATE.viewStart = Math.max(0, Math.min(STATE.bars.length - newLen,
      Math.round(anchorBar - relX * newLen)));
    recompute();
  }, { passive: false });
})();

function recompute() { computeAll(); render(); }
['ch-w1','ch-w2','ch-w3','ch-k','lv-pivot','lv-merge','lv-min','tr-take','tr-stop','tr-horizon','tr-er-max']
  .forEach(id => $(id).addEventListener('change', recompute));
$('view-len').addEventListener('change', recompute);
$('ch-style').addEventListener('change', render);
$('btn-view-all').addEventListener('click', () => {
  $('view-len').value = STATE.bars.length; STATE.viewStart = 0; recompute();
});
$('btn-view-end').addEventListener('click', () => {
  const viewLen = Math.min(STATE.bars.length, +$('view-len').value | 0);
  STATE.viewStart = Math.max(0, STATE.bars.length - viewLen); recompute();
});

for (const [btn, key] of [['toggle-channels','channels'], ['toggle-levels','levels'], ['toggle-trades','trades']]) {
  $(btn).addEventListener('click', () => {
    STATE.layers[key] = !STATE.layers[key];
    $(btn).classList.toggle('on', STATE.layers[key]);
    render();
  });
}

$('file-input').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  const txt = await f.text();
  try {
    const raw = JSON.parse(txt);
    if (!Array.isArray(raw) || !raw.length) throw new Error('пустой массив');
    loadBars(raw, f.name.replace(/\.json$/i, ''));
  } catch (e) { alert('Не удалось прочитать: ' + e.message); }
});

function loadBars(raw, ticker) {
  const bars = raw.map(r => ({
    time: typeof r.time === 'number' ? new Date(r.time * (r.time > 1e12 ? 1 : 1000)).toISOString().slice(0, 16).replace('T', ' ') : String(r.time || '').slice(0, 16).replace('T', ' '),
    open: +r.open, high: +r.high, low: +r.low, close: +r.close,
    volume: +(r.volume || 0),
  })).filter(b => isFinite(b.close));
  STATE.bars = bars; STATE.ticker = ticker;
  $('ticker-name').textContent = ticker; $('bar-count').textContent = bars.length;
  // Автоокно: у больших файлов дефолт 500, прыжок к концу истории. У маленьких
  // (демо ~500) показываем всё, чтобы не терять контекст сегментов.
  if (bars.length > 1500) {
    $('view-len').value = 500;
    STATE.viewStart = Math.max(0, bars.length - 500);
  } else {
    $('view-len').value = bars.length;
    STATE.viewStart = 0;
  }
  recompute();
}

// ── демо-данные ─────────────────────────────────────────────────────────────
$('btn-demo').addEventListener('click', () => {
  const bars = [];
  let p = 100; const rng = (function () { let s = 42; return () => (s = (s * 9301 + 49297) % 233280) / 233280 - 0.5; })();
  // 3 сегмента: uptrend → flat → downtrend, каждый ~150 баров
  const segs = [
    { n: 150, drift: 0.05, sigma: 0.35 },
    { n: 200, drift: 0.0, sigma: 0.5 },  // расширенный флэт для каналов
    { n: 150, drift: -0.04, sigma: 0.4 },
  ];
  let i = 0;
  for (const s of segs) {
    for (let k = 0; k < s.n; k++) {
      p += s.drift + rng() * s.sigma;
      const o = p, c = p + rng() * s.sigma * 0.5;
      const h = Math.max(o, c) + Math.abs(rng()) * s.sigma * 0.6;
      const l = Math.min(o, c) - Math.abs(rng()) * s.sigma * 0.6;
      const t = new Date(2026, 0, 1, 10, 0, 0);
      t.setMinutes(t.getMinutes() + 5 * i);
      bars.push({ time: t.toISOString().slice(0, 16).replace('T', ' '),
                  open: o, high: h, low: l, close: c, volume: 500 });
      p = c; i++;
    }
  }
  loadBars(bars, 'DEMO');
});

// на resize пересчитывать не надо (только draw), но пусть проще:
window.addEventListener('resize', () => render());
</script>
</html>
