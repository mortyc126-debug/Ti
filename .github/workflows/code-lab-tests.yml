name: Code Lab tests

on:
  push:
    branches:
      - main
      - "audit/fixes-2026-11-06"
    paths:
      - "tools/code-lab/**"
      - "tools/code-lab-server.mjs"
      - ".github/workflows/code-lab-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/code-lab/**"
      - "tools/code-lab-server.mjs"
      - ".github/workflows/code-lab-tests.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Code Lab regression tests
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(tools/code-lab/tests/*.test.mjs tools/code-lab/tests/*.test.js tools/code-lab/lib/*.test.mjs)
          if (( ${#tests[@]} == 0 )); then
            echo "::error::Тестовые файлы не найдены"
            exit 1
          fi
          failed=0
          for test_file in "${tests[@]}"; do
            echo "::group::${test_file}"
            if node "${test_file}"; then
              echo "PASS: ${test_file}"
            else
              echo "::error::FAIL: ${test_file}"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Audit library metadata and notes (read-only)
        if: always()
        run: node tools/code-lab/scripts/audit-library.mjs
      - name: Build duplicate merge manifest
        if: always() && hashFiles('audit-library-report.json') != ''
        run: node tools/code-lab/scripts/build-duplicate-merge-manifest.mjs audit-library-report.json duplicate-merge-manifest.json
      - name: Audit references to legacy fragment IDs
        if: always() && hashFiles('duplicate-merge-manifest.json') != ''
        run: node tools/code-lab/scripts/audit-duplicate-id-references.mjs tools/code-lab duplicate-merge-manifest.json duplicate-id-reference-report.json
      - name: Preview duplicate merge (read-only)
        if: always() && hashFiles('duplicate-merge-manifest.json') != ''
        run: node tools/code-lab/scripts/preview-duplicate-merge.mjs tools/code-lab/library duplicate-merge-manifest.json duplicate-merge-preview.json
      - name: Upload library audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-lab-library-audit-${{ matrix.os }}
          path: |
            audit-library-report.json
            duplicate-merge-manifest.json
            duplicate-id-reference-report.json
            duplicate-merge-preview.json
            query-phrase-audit.json
          if-no-files-found: warn
          retention-days: 7
